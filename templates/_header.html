<header
  class="sticky top-0 z-50 border-b border-slate-200 bg-white/85 backdrop-blur-sm"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8"
  >
    <a
      href="{{ url_for('index') }}"
      class="flex items-center gap-3"
      aria-label="Accueil"
    >
      <div class="leading-tight">
        <p
          class="text-[10px] font-semibold uppercase tracking-[0.22em] text-slate-500"
        >
          Stack
        </p>
        <p class="text-sm font-black uppercase text-slate-800">Détecteur</p>
      </div>
    </a>

    <nav
      class="hidden items-center gap-6 md:flex"
      aria-label="Navigation principale"
    >
      <a
        href="{{ url_for('index') }}"
        class="text-sm font-medium text-slate-600 transition-colors hover:text-slate-900"
      >
        Accueil
      </a>
      <a
        href="https://github.com/Programmeur-Community/Stack-Detector"
        target="_blank"
        class="text-sm font-medium text-slate-600 transition-colors hover:text-slate-900"
      >
        Code source
      </a>
    </nav>

    <div class="hidden items-center gap-3 md:flex">
      <a
        href="{{ url_for('index') }}"
        class="inline-flex items-center justify-center rounded-lg bg-slate-800 px-4 py-2 text-sm text-white transition-colors hover:bg-slate-900"
      >
        Analyser un site
      </a>
    </div>

    <button
      id="mobile-menu-button"
      type="button"
      class="inline-flex items-center justify-center rounded-md border border-slate-200 p-2 text-slate-700 transition-colors hover:bg-slate-100 md:hidden"
      aria-label="Ouvrir le menu"
      aria-expanded="false"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </div>

  <nav
    id="mobile-menu"
    class="hidden border-t border-slate-200 bg-white md:hidden"
    aria-label="Menu mobile"
  >
    <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-3 sm:px-6">
      <a
        href="{{ url_for('index') }}"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100"
      >
        Accueil
      </a>
      <a
        href="https://github.com/Programmeur-Community/Stack-Detector"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100"
      >
        Code source
      </a>
      <a
        href="{{ url_for('index') }}"
        class="mt-1 inline-flex items-center justify-center rounded-lg bg-slate-800 px-4 py-2.5 text-sm text-white transition-colors hover:bg-slate-900"
      >
        Analyser un site
      </a>
    </div>
  </nav>
</header>
